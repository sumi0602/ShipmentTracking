services:
  - type: web
    name: shipment-tracker
    env: node
    plan: free
    buildCommand: |
      apt-get install -y php8.1 php8.1-cli php8.1-mbstring php8.1-xml php8.1-zip php8.1-curl unzip curl
      curl -sS https://getcomposer.org/installer | php8.1
      php8.1 composer.phar install --no-dev --optimize-autoloader
    startCommand: php8.1 artisan serve --host=0.0.0.0 --port=10000